      - max_page_size
      - name
      - requires_credentials
      - supports_filters
      - supports_search
      - terms
    ProviderCompany:
      type: object
      description: 'One provider company: the output of a search and the inline input
        of an import.'
      properties:
        name:
          type: string
          maxLength: 2000
        website:
          type: string
          nullable: true
          maxLength: 2000
        domain_hint:
          type: string
          nullable: true
          maxLength: 2000
        profile_url:
          type: string
          nullable: true
          maxLength: 2000
        country:
          type: string
          nullable: true
          maxLength: 50
        industry:
          type: string
          nullable: true
          maxLength: 2000
        employee_count:
          type: integer
          minimum: 0
          nullable: true
        employee_range:
          type: string
          nullable: true
          maxLength: 2000
        headquarters:
          type: string
          nullable: true
          maxLength: 2000
        description:
          type: string
          nullable: true
          maxLength: 5000
        provider_id:
          type: string
          nullable: true
          maxLength: 200
        provider_url:
          type: string
          nullable: true
          maxLength: 2000
        confidence:
          type: number
          format: double
          nullable: true
        extra:
          type: object
          additionalProperties: {}
      required:
      - name
    ProviderCompanyRequest:
      type: object
      description: 'One provider company: the output of a search and the inline input
        of an import.'
      properties:
        name:
          type: string
          maxLength: 2000
        website:
          type: string
          nullable: true
          maxLength: 2000
        domain_hint:
          type: string
          nullable: true
          maxLength: 2000
        profile_url:
          type: string
          nullable: true
          maxLength: 2000
        country:
          type: string
          nullable: true
          maxLength: 50
        industry:
          type: string
          nullable: true
          maxLength: 2000
        employee_count:
          type: integer
          minimum: 0
          nullable: true
        employee_range:
          type: string
          nullable: true
          maxLength: 2000
        headquarters:
          type: string
          nullable: true
          maxLength: 2000
        description:
          type: string
          nullable: true
          maxLength: 5000
        provider_id:
          type: string
          nullable: true
          maxLength: 200
        provider_url:
          type: string
          nullable: true
          maxLength: 2000
        confidence:
          type: number
          format: double
          nullable: true
        extra:
          type: object
          additionalProperties: {}
      required:
      - name
    ProviderImportBatch:
      type: object
      properties:
        id:
          type: string
          format: uuid
        campaign:
          type: string
          format: uuid
        provider:
          type: string
        status:
          type: string
          description: pending, processing, completed, partial, failed.
        background:
          type: boolean
          description: Processed by a background job.
        job_id:
          type: string
          format: uuid
          nullable: true
        total_count:
          type: integer
        created_count:
          type: integer
        duplicate_count:
          type: integer
        restored_count:
          type: integer
        skipped_count:
          type: integer
        failed_count:
          type: integer
        processed_count:
          type: integer
        progress_percent:
          type: integer
        error_summary:
          type: string
        provider_error:
          type: object
          additionalProperties: {}
          nullable: true
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        rows:
          type: array
          items:
            $ref: '#/components/schemas/ImportRow'
      required:
      - background
      - campaign
      - created_count
      - duplicate_count
      - error_summary
      - failed_count
      - finished_at
      - id
      - job_id
      - processed_count
      - progress_percent
      - provider
      - restored_count
      - rows
      - skipped_count
      - started_at
      - status
      - total_count
    ProviderImportRequestRequest:
      type: object
      properties:
        provider:
          type: string
          minLength: 1
          maxLength: 64
        provider_ids:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 200
          description: Provider ids to import; they are re-found with `search` (or
            the campaign defaults). Give this or `companies`.
        companies:
          type: array
          items:
            $ref: '#/components/schemas/ProviderCompanyRequest'
          description: Provider companies exactly as a preview returned them (`items[].company`).
        search:
          allOf:
          - $ref: '#/components/schemas/SearchParamsRequest'
          description: 'The search the selection came from (same shape as the search
            body without `provider`): stored as provenance and used to find `provider_ids`.'
        retrieved_at:
          type: string
          format: date-time
          description: '`retrieved_at` of the preview (inline companies).'
      required:
      - provider
    ProviderSearchRequestRequest:
      type: object
      properties:
        query:
          type: string
          maxLength: 200
        filters:
          $ref: '#/components/schemas/SearchFiltersRequest'
        page_size:
          type: integer
          maximum: 100
          minimum: 1
          default: 25
        cursor:
          type: string
          nullable: true
          minLength: 1
          maxLength: 512
        provider:
          type: string
          minLength: 1
          description: Provider name from `/providers/`.
          maxLength: 64
      required:
      - provider
    ProviderSearchResponse:
      type: object
      properties:
        provider:
          type: string
        retrieved_at:
          type: string
          format: date-time
        search:
          allOf:
          - $ref: '#/components/schemas/SearchEcho'
          description: The effective search (campaign defaults + overrides).
        items:
          type: array
          items:
            $ref: '#/components/schemas/PreviewItem'
        counts:
          type: object
          additionalProperties:
            type: integer
        next_cursor:
          type: string
          nullable: true
        total_estimate:
          type: integer
          nullable: true
        warnings:
          type: array
          items:
            type: string
      required:
      - counts
      - items
      - next_cursor
      - provider
      - retrieved_at
      - search
      - total_estimate
      - warnings
    Readiness:
      type: object
      description: 'Body of `/readyz`: 200 when `status` is `ok`, 503 when `unavailable`.'
      properties:
        status:
          $ref: '#/components/schemas/ReadinessStatusEnum'
        checks:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Check'
          description: 'Keyed by check: database, migrations, worker.'
      required:
      - checks
      - status
    ReadinessStatusEnum:
      enum:
      - ok
      - unavailable
      type: string
      description: |-
        * `ok` - ok
        * `unavailable` - unavailable
    RefreshTokenRequest:
      type: object
      description: Body of `refresh/` and `logout/` (documentation only; the views
        read the raw body).
      properties:
        refresh:
          type: string
          minLength: 1
          description: Refresh token. May be omitted when the refresh cookie is enabled.
    RulesSummary:
      type: object
      description: |-
        The profile in the structure the AI prompts consume. Versioned by `schema_version`.

        Built by `apps.campaigns.rules_summary.build_rules_summary`; see that module for the
        contract. A change to this shape must bump `schema_version`.
      properties:
        schema_version:
          type: integer
          description: Shape of this document; currently 1.
        campaign:
          $ref: '#/components/schemas/RulesSummaryCampaign'
        profile_version:
          type: integer
          description: The CampaignProfile version used.
        offer:
          type: string
        targeting:
          $ref: '#/components/schemas/RulesSummaryTargeting'
        exclusions:
          $ref: '#/components/schemas/RulesSummaryExclusions'
        buyers:
          $ref: '#/components/schemas/RulesSummaryBuyers'
        outreach:
          $ref: '#/components/schemas/RulesSummaryOutreach'
        custom_rules:
          type: string
        structured_rules:
          type: array
          items:
            type: object
            additionalProperties: {}
          description: Reserved for a future machine-readable rule list; always empty
            in schema_version 1.
      required:
      - buyers
      - campaign
      - custom_rules
      - exclusions
      - offer
      - outreach
      - profile_version
      - schema_version
      - structured_rules
      - targeting
    RulesSummaryBuyers:
      type: object
      properties:
        target_departments:
          type: array
          items:
            type: string
        preferred_buyer_titles:
          type: array
          items:
            type: string
          description: Most preferred first.
      required:
      - preferred_buyer_titles
      - target_departments
    RulesSummaryCampaign:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
      required:
      - id
      - name
    RulesSummaryCompanySize:
      type: object
      properties:
        min:
          type: integer
          nullable: true
        max:
          type: integer
          nullable: true
      required:
      - max
      - min
    RulesSummaryExclusions:
      type: object
      properties:
        industries:
          type: array
          items:
            type: string
        company_types:
          type: array
          items:
            type: string
      required:
      - company_types
      - industries
    RulesSummaryOutreach:
      type: object
      properties:
        languages:
          type: array
          items:
            type: string
      required:
      - languages
    RulesSummaryTargeting:
      type: object
      properties:
        countries:
          type: array
          items:
            type: string
        industries:
          type: array
          items:
            type: string
        company_size:
          $ref: '#/components/schemas/RulesSummaryCompanySize'
        business_model:
          $ref: '#/components/schemas/BusinessModelEnum'
      required:
      - business_model
      - company_size
      - countries
      - industries
    SearchEcho:
      type: object
      properties:
        query:
          type: string
        countries:
          type: array
          items:
            type: string
        industries:
          type: array
          items:
            type: string
        employee_min:
          type: integer
          nullable: true
        employee_max:
          type: integer
          nullable: true
        business_model:
          type: string
        excluded_industries:
          type: array
          items:
            type: string
        excluded_company_types:
          type: array
          items:
            type: string
        sort:
          type: string
        page_size:
          type: integer
        limit:
          type: integer
        cursor:
          type: string
          nullable: true
      required:
      - business_model
      - countries
      - cursor
      - employee_max
      - employee_min
      - excluded_company_types
      - excluded_industries
      - industries
      - limit
      - page_size
      - query
      - sort
    SearchFiltersRequest:
      type: object
      description: |-
        Filters that replace the campaign-derived defaults. A key that is present wins: an empty
        list or `null` clears that filter; a key left out keeps the campaign value.
      properties:
        countries:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 100
          description: ISO 3166-1 alpha-2 codes.
          maxItems: 50
        industries:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 100
          maxItems: 50
        employee_min:
          type: integer
          minimum: 0
          nullable: true
        employee_max:
          type: integer
          minimum: 0
          nullable: true
        business_model:
          type: string
          description: '`b2b`, `b2c`, `both` or empty for any.'
          maxLength: 10
        excluded_industries:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 100
          maxItems: 50
        excluded_company_types:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 100
          maxItems: 50
        sort:
          $ref: '#/components/schemas/SortEnum'
    SearchParamsRequest:
      type: object
      properties:
        query:
          type: string
          maxLength: 200
        filters:
          $ref: '#/components/schemas/SearchFiltersRequest'
        page_size:
          type: integer
          maximum: 100
          minimum: 1
          default: 25
        cursor:
          type: string
          nullable: true
          minLength: 1
          maxLength: 512
    SortEnum:
      enum:
      - relevance
      - name
      - employee_count_desc
      - employee_count_asc
      type: string
      description: |-
        * `relevance` - relevance
        * `name` - name
        * `employee_count_desc` - employee_count_desc
        * `employee_count_asc` - employee_count_asc
    TokenObtainPairRequest:
      type: object
      properties:
        email:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
    TokenResponse:
      type: object
      description: Tokens returned by `login/` and `refresh/` (documentation only).
      properties:
        access:
          type: string
          description: Short-lived JWT access token (Bearer).
        refresh:
          type: string
          description: Refresh token. Omitted when the refresh cookie is enabled (it
            is then delivered as an httpOnly cookie).
      required:
      - access
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
        name:
          type: string
          readOnly: true
        is_staff:
          type: boolean
          readOnly: true
          description: Can sign in to the Django admin.
        last_login:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - email
      - id
      - is_staff
      - last_login
      - name
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
- name: auth
  description: JWT login, refresh, logout and the current user.
- name: campaigns
  description: Campaigns, versioned profiles, rules summary.
- name: clients
  description: 'Clients (tenants): list, create, edit, archive.'
- name: integrations
  description: Per-client provider connections; credentials are write-only.
- name: health
  description: Liveness and readiness probes (no auth).
- name: meta
  description: API metadata.
- name: provider import
  description: 'Company data providers: search preview and import into a campaign.'
