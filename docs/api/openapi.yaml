      description: 'Liveness: the process is serving requests. Touches no dependency.'
      summary: Liveness probe
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unexpected server error (`internal_error`).
  /readyz:
    get:
      operationId: health_ready
      description: 'Readiness: 200 when every check passes, otherwise 503 with the
        same JSON body.'
      summary: Readiness probe
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
          description: At least one check failed.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unexpected server error (`internal_error`).
components:
  schemas:
    ApiLinks:
      type: object
      properties:
        self:
          type: string
          format: uri
          description: Absolute URL of this endpoint.
      required:
      - self
    ApiRoot:
      type: object
      description: Body of `GET /api/v1/` (documentation only).
      properties:
        name:
          type: string
        version:
          type: string
        links:
          $ref: '#/components/schemas/ApiLinks'
      required:
      - links
      - name
      - version
    BusinessModelEnum:
      enum:
      - b2b
      - b2c
      - both
      type: string
      description: |-
        * `b2b` - B2B
        * `b2c` - B2C
        * `both` - B2B and B2C
    Campaign:
      type: object
      description: A campaign with its current profile. ``status`` changes only through
        the actions.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        client:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/CampaignStatusEnum'
          readOnly: true
        archived_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        profile_version:
          type: integer
          readOnly: true
        profile:
          allOf:
          - $ref: '#/components/schemas/CampaignProfile'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - archived_at
      - client
      - created_at
      - id
      - name
      - profile
      - profile_version
      - status
      - updated_at
    CampaignCloneRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          description: 'Name of the copy. Default: "<name> (copy)", numbered if that
            is taken.'
          maxLength: 200
    CampaignProfile:
      type: object
      description: One immutable profile version (the rules of Brief section 3).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        campaign:
          type: string
          format: uuid
          readOnly: true
        version:
          type: integer
          readOnly: true
        offer:
          type: string
          readOnly: true
        countries:
          type: array
          items:
            type: string
          readOnly: true
        industries:
          type: array
          items:
            type: string
          readOnly: true
        company_size_min:
          type: integer
          readOnly: true
          nullable: true
        company_size_max:
          type: integer
          readOnly: true
          nullable: true
        business_model:
          allOf:
          - $ref: '#/components/schemas/BusinessModelEnum'
          readOnly: true
        excluded_industries:
          type: array
          items:
            type: string
          readOnly: true
        excluded_company_types:
          type: array
          items:
            type: string
          readOnly: true
        target_departments:
          type: array
          items:
            type: string
          readOnly: true
        preferred_buyer_titles:
          type: array
          items:
            type: string
          readOnly: true
          description: Ordered, most preferred first.
        outreach_languages:
          type: array
          items:
            type: string
          readOnly: true
        custom_rules:
          type: string
          readOnly: true
          description: Free-form qualification notes.
        change_note:
          type: string
          readOnly: true
          description: Why this version was made.
        created_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - business_model
      - campaign
      - change_note
      - company_size_max
      - company_size_min
      - countries
      - created_at
      - created_by
      - custom_rules
      - excluded_company_types
      - excluded_industries
      - id
      - industries
      - offer
      - outreach_languages
      - preferred_buyer_titles
      - target_departments
      - version
    CampaignProfileInputRequest:
      type: object
      description: |-
        The rule fields of a campaign. Anything not listed is rejected, nothing is dropped.

        On create ``offer`` is required and the rest defaults to empty. On PUT/PATCH a field left out
        keeps its value from the current version; send ``[]`` / ``null`` / ``""`` to clear it.
      properties:
        offer:
          type: string
          minLength: 1
          description: What the client sells, in plain words.
          maxLength: 5000
        countries:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 200
          description: ISO 3166-1 alpha-2 codes (case-insensitive input, stored upper
            case).
          maxItems: 100
        industries:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 200
          maxItems: 100
        company_size_min:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        company_size_max:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
          description: Must be at least `company_size_min` when both are set.
        business_model:
          $ref: '#/components/schemas/BusinessModelEnum'
        excluded_industries:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 200
          maxItems: 100
        excluded_company_types:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 200
          maxItems: 100
        target_departments:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 200
          maxItems: 100
        preferred_buyer_titles:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 200
          description: Ordered, most preferred first. Duplicates are removed keeping
            the first.
          maxItems: 100
        outreach_languages:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 200
          description: Supported language codes (`settings.OUTREACH_LANGUAGES`, `en`
            and `ar`).
          maxItems: 100
        custom_rules:
          type: string
          description: Free-form notes.
          maxLength: 10000
        change_note:
          type: string
          description: Why this version is made.
          maxLength: 1000
      required:
      - offer
    CampaignStatusEnum:
      enum:
      - draft
      - active
      - archived
      type: string
      description: |-
        * `draft` - Draft
        * `active` - Active
        * `archived` - Archived
    CampaignWriteRequest:
      type: object
      description: |-
        Body of create (POST) and edit (PUT/PATCH).

        ``name`` goes through ``update_campaign``; ``profile`` (the rules) through
        ``create_profile_version``, which makes a new version only when something changed.
      properties:
        client:
          type: string
          format: uuid
          description: Required on `POST /campaigns/`; taken from the URL on the nested
            route; cannot be changed on edit.
        name:
          type: string
          minLength: 1
          maxLength: 200
        profile:
          $ref: '#/components/schemas/CampaignProfileInputRequest'
      required:
      - name
    CategoryEnum:
      enum:
      - llm
      - company_data
      - people_data
      - email_enrichment
      - email_verification
      - crm
      - outreach
      - storage
      - automation
      type: string
      description: |-
        * `llm` - LLM
        * `company_data` - Company data
        * `people_data` - People data
        * `email_enrichment` - Email enrichment
        * `email_verification` - Email verification
        * `crm` - CRM
        * `outreach` - Outreach
        * `storage` - Storage
        * `automation` - Automation
    Check:
      type: object
      description: One readiness check; the extra fields depend on the check (documentation
        only).
      properties:
        status:
          $ref: '#/components/schemas/CheckStatusEnum'
        detail:
          type: string
          description: Fixed explanation of a failure.
        pending:
          type: array
          items:
            type: string
          description: 'migrations: up to 10 unapplied migrations.'
        pending_count:
          type: integer
          description: 'migrations: total pending.'
        clusters:
          type: integer
          description: 'worker: live clusters.'
        heartbeat_age_seconds:
          type: number
          format: double
          description: 'worker: age of the newest heartbeat.'
      required:
      - status
    CheckStatusEnum:
      enum:
      - ok
      - fail
      - skipped
      type: string
      description: |-
        * `ok` - ok
        * `fail` - fail
        * `skipped` - skipped
    Client:
      type: object
      description: |-
        A client. ``status`` and the timestamps are read-only: use ``archive/`` and ``restore/``.

        Name uniqueness (case-insensitive, among non-archived clients) is enforced by the service
        layer and reported as a ``name`` field error in the standard error envelope.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 200
        notes:
          type: string
        status:
          allOf:
          - $ref: '#/components/schemas/ClientStatusEnum'
          readOnly: true
        archived_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - archived_at
      - created_at
      - id
      - name
      - status
      - updated_at
    ClientRequest:
      type: object
      description: |-
        A client. ``status`` and the timestamps are read-only: use ``archive/`` and ``restore/``.

        Name uniqueness (case-insensitive, among non-archived clients) is enforced by the service
        layer and reported as a ``name`` field error in the standard error envelope.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        notes:
          type: string
      required:
      - name
    ClientStatusEnum:
      enum:
      - active
      - archived
      type: string
      description: |-
        * `active` - Active
        * `archived` - Archived
    Connection:
      type: object
      description: A connection as returned by the API. Never contains a secret.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        client:
          type: string
          format: uuid
          readOnly: true
        category:
          allOf:
          - $ref: '#/components/schemas/CategoryEnum'
          readOnly: true
        provider:
          type: string
          readOnly: true
          description: Provider key, e.g. 'openai' or 'fake'.
        name:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ConnectionStatusEnum'
          readOnly: true
        config:
          readOnly: true
          description: Non-secret settings. Never put a secret here.
        has_credentials:
          type: boolean
          readOnly: true
          description: True when credentials are stored. Their values are never shown.
        credentials_hint:
          type: object
          additionalProperties:
            type: string
          readOnly: true
          description: 'Masked hint per credential name: `****abcd` (last 4 characters)
            for long secrets, `****` for short ones.'
        credentials_updated_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        last_tested_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        last_test_status:
          allOf:
          - $ref: '#/components/schemas/LastTestStatusEnum'
          readOnly: true
        last_test_message:
          type: string
          readOnly: true
        archived_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - archived_at
      - category
      - client
      - config
      - created_at
      - created_by
      - credentials_hint
      - credentials_updated_at
      - has_credentials
      - id
      - last_test_message
      - last_test_status
      - last_tested_at
      - name
      - provider
      - status
      - updated_at
    ConnectionCreateRequest:
      type: object
      properties:
        client:
          type: string
          format: uuid
          description: The client this connection belongs to.
        category:
          $ref: '#/components/schemas/CategoryEnum'
        provider:
          type: string
          minLength: 1
          description: Provider key, e.g. `openai`. Lower-case letters, digits and
            underscores.
          maxLength: 64
          pattern: ^[a-z][a-z0-9_]{0,63}$
        name:
          type: string
          minLength: 1
          maxLength: 200
        status:
          allOf:
          - $ref: '#/components/schemas/ConnectionCreateStatusEnum'
          default: active
        config:
          type: object
          additionalProperties: {}
          description: Non-secret settings (JSON object). Secrets are rejected here.
        credentials:
          type: object
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 4096
          writeOnly: true
          description: 'Write-only secrets by name, e.g. `{"api_key": "..."}`. On
            update they replace all stored credentials. Never returned.'
      required:
      - category
      - client
      - name
      - provider
    ConnectionCreateStatusEnum:
      enum:
      - active
      - disabled
      type: string
      description: |-
        * `active` - active
        * `disabled` - disabled
    ConnectionStatusEnum:
      enum:
      - active
      - disabled
      - error
      type: string
      description: |-
        * `active` - Active
        * `disabled` - Disabled
        * `error` - Error
    ConnectionUpdateRequest:
      type: object
      description: 'Category and provider are fixed: create a new connection to switch
        provider.'
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        config:
          type: object
          additionalProperties: {}
          description: Replaces the whole config. Secrets are rejected here.
        credentials:
          type: object
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 4096
          writeOnly: true
          description: 'Write-only secrets by name, e.g. `{"api_key": "..."}`. On
            update they replace all stored credentials. Never returned.'
    Dedupe:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/DedupeStatusEnum'
        matched_on:
          type: string
          nullable: true
          description: domain, profile, name_country or provider_key.
        company:
          allOf:
          - $ref: '#/components/schemas/MatchedCompany'
          nullable: true
        field_errors:
          type: array
          items:
            type: object
            additionalProperties:
              type: string
          description: Field errors when status is `invalid`.
      required:
      - company
      - field_errors
      - matched_on
      - status
    DedupeStatusEnum:
      enum:
      - new
      - duplicate
      - possible_duplicate
      - already_imported
      - invalid
      type: string
      description: |-
        * `new` - new
        * `duplicate` - duplicate
        * `possible_duplicate` - possible_duplicate
        * `already_imported` - already_imported
        * `invalid` - invalid
    ErrorBody:
      type: object
      description: The `error` object of the standard envelope (apps/core/exceptions.py).
      properties:
        code:
          type: string
          description: Stable machine-readable code, e.g. `validation_error`.
        message:
          type: string
          description: Human-readable summary; may change, do not parse.
        details:
          nullable: true
          description: Field errors for `validation_error`, `{retry_after}` for `throttled`,
            else null.
        request_id:
          type: string
          nullable: true
          description: Value of the `X-Request-ID` response header.
      required:
      - code
      - details
      - message
      - request_id
    ErrorEnvelope:
      type: object
      description: Every error response of the API has this body.
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
      required:
      - error
    Health:
      type: object
      description: Body of `/healthz` (documentation only).
      properties:
        status:
          $ref: '#/components/schemas/HealthStatusEnum'
      required:
      - status
    HealthStatusEnum:
      enum:
      - ok
      type: string
      description: '* `ok` - ok'
    ImportRow:
      type: object
      properties:
        row_number:
          type: integer
        name:
          type: string
        outcome:
          type: string
          description: created, duplicate, restored, skipped or failed.
        error_code:
          type: string
        error_message:
          type: string
        company_id:
          type: string
          format: uuid
          nullable: true
        match_strength:
          type: string
          description: strong, weak or blank.
        matched_on:
          type: string
        possible_duplicate:
          type: boolean
          description: Created, but flagged as a possible duplicate of `candidate_id`.
        candidate_id:
          type: string
          format: uuid
          nullable: true
      required:
      - candidate_id
      - company_id
      - error_code
      - error_message
      - match_strength
      - matched_on
      - name
      - outcome
      - possible_duplicate
      - row_number
    LastTestStatusEnum:
      enum:
      - ok
      - failed
      type: string
      description: |-
        * `ok` - OK
        * `failed` - Failed
    MatchedCompany:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        website:
          type: string
        country:
          type: string
        archived:
          type: boolean
      required:
      - archived
      - country
      - id
      - name
      - website
    PaginatedCampaignList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Campaign'
    PaginatedCampaignProfileList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/CampaignProfile'
    PaginatedClientList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Client'
    PaginatedConnectionList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Connection'
    PaginatedProviderCapabilitiesList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/ProviderCapabilities'
    PatchedCampaignWriteRequest:
      type: object
      description: |-
        Body of create (POST) and edit (PUT/PATCH).

        ``name`` goes through ``update_campaign``; ``profile`` (the rules) through
        ``create_profile_version``, which makes a new version only when something changed.
      properties:
        client:
          type: string
          format: uuid
          description: Required on `POST /campaigns/`; taken from the URL on the nested
            route; cannot be changed on edit.
        name:
          type: string
          minLength: 1
          maxLength: 200
        profile:
          $ref: '#/components/schemas/CampaignProfileInputRequest'
    PatchedClientRequest:
      type: object
      description: |-
        A client. ``status`` and the timestamps are read-only: use ``archive/`` and ``restore/``.

        Name uniqueness (case-insensitive, among non-archived clients) is enforced by the service
        layer and reported as a ``name`` field error in the standard error envelope.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        notes:
          type: string
    PatchedConnectionUpdateRequest:
      type: object
      description: 'Category and provider are fixed: create a new connection to switch
        provider.'
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        config:
          type: object
          additionalProperties: {}
          description: Replaces the whole config. Secrets are rejected here.
        credentials:
          type: object
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 4096
          writeOnly: true
          description: 'Write-only secrets by name, e.g. `{"api_key": "..."}`. On
            update they replace all stored credentials. Never returned.'
    PreviewItem:
      type: object
      properties:
        provider_key:
          type: string
          nullable: true
        company:
          $ref: '#/components/schemas/ProviderCompany'
        dedupe:
          $ref: '#/components/schemas/Dedupe'
        importable:
          type: boolean
      required:
      - company
      - dedupe
      - importable
      - provider_key
    ProviderCapabilities:
      type: object
      properties:
        name:
          type: string
        terms:
          type: string
          description: licensed_api, public_data or manual.
        supports_search:
          type: boolean
        supports_filters:
          type: object
          additionalProperties:
            type: boolean
        max_page_size:
          type: integer
        requires_credentials:
          type: boolean
        max_import_selection:
          type: integer
          description: Most companies per import.
        inline_import_max:
          type: integer
          description: Imports up to this size finish inside the request (201); larger
            run in a background job (202).
      required:
      - inline_import_max
