      - created_at
      - created_by
      - credentials_hint
      - credentials_updated_at
      - has_credentials
      - id
      - last_test_message
      - last_test_status
      - last_tested_at
      - name
      - provider
      - status
      - updated_at
    ConnectionCreateRequest:
      type: object
      properties:
        client:
          type: string
          format: uuid
          description: The client this connection belongs to.
        category:
          $ref: '#/components/schemas/CategoryEnum'
        provider:
          type: string
          minLength: 1
          description: Provider key, e.g. `openai`. Lower-case letters, digits and
            underscores.
          maxLength: 64
          pattern: ^[a-z][a-z0-9_]{0,63}$
        name:
          type: string
          minLength: 1
          maxLength: 200
        status:
          allOf:
          - $ref: '#/components/schemas/ConnectionCreateStatusEnum'
          default: active
        config:
          type: object
          additionalProperties: {}
          description: Non-secret settings (JSON object). Secrets are rejected here.
        credentials:
          type: object
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 4096
          writeOnly: true
          description: 'Write-only secrets by name, e.g. `{"api_key": "..."}`. On
            update they replace all stored credentials. Never returned.'
      required:
      - category
      - client
      - name
      - provider
    ConnectionCreateStatusEnum:
      enum:
      - active
      - disabled
      type: string
      description: |-
        * `active` - active
        * `disabled` - disabled
    ConnectionStatusEnum:
      enum:
      - active
      - disabled
      - error
      type: string
      description: |-
        * `active` - Active
        * `disabled` - Disabled
        * `error` - Error
    ConnectionTestResult:
      type: object
      description: 'The outcome of ``POST .../{id}/test/``. The message is untrusted
        text: show it as text.'
      properties:
        result:
          allOf:
          - $ref: '#/components/schemas/ResultEnum'
          readOnly: true
          description: |-
            `ok` or `failed` (stored on the connection), or `unconfigured` when no test exists for this provider yet (nothing is stored and nothing succeeded).

            * `ok` - ok
            * `failed` - failed
            * `unconfigured` - unconfigured
        ok:
          type: boolean
          readOnly: true
          description: True only for `ok`.
        message:
          type: string
          readOnly: true
          description: Short, scrubbed reason. Never contains credentials. Render
            as plain text.
        connection:
          allOf:
          - $ref: '#/components/schemas/Connection'
          readOnly: true
      required:
      - connection
      - message
      - ok
      - result
    ConnectionUpdateRequest:
