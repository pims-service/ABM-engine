      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        config:
          type: object
          additionalProperties: {}
          description: Replaces the whole config. Secrets are rejected here.
        credentials:
          type: object
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 4096
          writeOnly: true
          nullable: true
          description: 'Write-only secrets by name, e.g. `{"api_key": "..."}`. On
            update they replace all stored credentials. Never returned.'
