openapi: 3.0.3
info:
  title: ABM Engine API
  version: 0.1.0
  description: 'Backend API of the ABM Engine. Authenticate with `POST /api/v1/auth/login/`
    and send `Authorization: Bearer <access>`. Every error uses the `ErrorEnvelope`
    body.'
paths:
  /api/v1/:
    get:
      operationId: api_root
      description: Public entry point of the v1 API.
      summary: API name, version and self link
      tags:
      - meta
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiRoot'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Throttled (`throttled`, with `details.retry_after`).
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unexpected server error (`internal_error`).
  /api/v1/auth/login/:
    post:
      operationId: auth_login
      description: |-
        Exchange email and password for an access and refresh token.

        Every failure (unknown email, wrong password, inactive user) returns the same generic 401.
      summary: Log in
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Validation or parse error (`validation_error`, `parse_error`).
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Missing, invalid or expired credentials (`not_authenticated`,
            `authentication_failed`).
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Throttled (`throttled`, with `details.retry_after`).
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unexpected server error (`internal_error`).
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout
      description: Blacklist the refresh token (and clear the cookie). Access tokens
        expire on their own.
      summary: Log out (blacklist the refresh token)
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      security:
      - {}
      responses:
        '204':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Validation or parse error (`validation_error`, `parse_error`).
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Missing, invalid or expired credentials (`not_authenticated`,
            `authentication_failed`).
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Throttled (`throttled`, with `details.retry_after`).
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unexpected server error (`internal_error`).
  /api/v1/auth/me/:
    get:
      operationId: auth_me
      description: The authenticated user.
      summary: Current user
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Missing, invalid or expired credentials (`not_authenticated`,
            `authentication_failed`).
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Throttled (`throttled`, with `details.retry_after`).
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unexpected server error (`internal_error`).
  /api/v1/auth/refresh/:
    post:
      operationId: auth_refresh
      description: 'Rotate: returns a new access token and a new refresh token, blacklisting
        the old one.'
      summary: Refresh the token pair
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Validation or parse error (`validation_error`, `parse_error`).
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Missing, invalid or expired credentials (`not_authenticated`,
            `authentication_failed`).
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Throttled (`throttled`, with `details.retry_after`).
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unexpected server error (`internal_error`).
  /api/v1/campaigns/:
    get:
      operationId: campaigns_list
      description: 'Campaigns of the clients the user is a member of (all for a global
        admin), paginated, each with its current profile. Archived campaigns are hidden
        unless `archived`/`status` ask for them. Filter by `client`, or use `/clients/{client_pk}/campaigns/`.
        Needs the `READ` level: any member. Others get 403; campaigns of clients you
        are not a member of give 404.'
      summary: List campaigns
      parameters:
      - in: query
        name: archived
        schema:
          enum:
          - 'false'
          - 'true'
          - all
          type: string
          minLength: 1
        description: |-
          `false` (default) hides archived campaigns, `true` shows only archived ones, `all` shows both.

          * `false` - false
          * `true` - true
          * `all` - all
      - in: query
        name: client
        schema:
          type: string
          format: uuid
        description: Only campaigns of this client (ignored on the nested route).
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          enum:
          - draft
          - active
          - archived
          type: string
          minLength: 1
        description: |-
          Only campaigns with this status. `archived` implies `archived=true` unless `archived` is given.

          * `draft` - Draft
          * `active` - Active
          * `archived` - Archived
      tags:
      - campaigns
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCampaignList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Validation or parse error (`validation_error`, `parse_error`).
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Missing, invalid or expired credentials (`not_authenticated`,
            `authentication_failed`).
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Not allowed (`permission_denied`).
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Throttled (`throttled`, with `details.retry_after`).
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unexpected server error (`internal_error`).
    post:
      operationId: campaigns_create
      description: 'Creates a draft campaign and its profile version 1 in one transaction.
        `client` is required. The name must be unique, ignoring case, among the client''s
        non-archived campaigns. Field errors on rules are nested under `profile`.
        Unsupported fields (e.g. `structured_rules`) give 400. Needs the `EDIT` level:
        manager and admin, in the target client. Others get 403; campaigns of clients
        you are not a member of give 404.'
      summary: Create a campaign
      tags:
      - campaigns
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignWriteRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Validation or parse error (`validation_error`, `parse_error`).
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Missing, invalid or expired credentials (`not_authenticated`,
            `authentication_failed`).
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Not allowed (`permission_denied`).
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Not found (`not_found`).
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Throttled (`throttled`, with `details.retry_after`).
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unexpected server error (`internal_error`).
  /api/v1/campaigns/{id}/:
    get:
      operationId: campaigns_retrieve
      description: 'The campaign with its current profile. Archived campaigns can
        be retrieved by id. Needs the `READ` level: any member. Others get 403; campaigns
        of clients you are not a member of give 404.'
      summary: Get a campaign
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this campaign.
        required: true
      tags:
      - campaigns
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Missing, invalid or expired credentials (`not_authenticated`,
            `authentication_failed`).
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Not allowed (`permission_denied`).
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Not found (`not_found`).
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Throttled (`throttled`, with `details.retry_after`).
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unexpected server error (`internal_error`).
    put:
      operationId: campaigns_update
      description: '`name` and `profile.offer` are required; other rule fields left
        out keep their current value (send `[]`, `null` or `""` to clear). Changing
        any rule creates a NEW immutable profile version (the response shows it in
        `profile_version`); if the rules equal the current version nothing is created
        and the response is still 200 (see the `X-Profile-Version-Created` header).
        `name` changes are audited separately. An archived campaign is read-only (400).
        Rule field errors are nested under `profile`; unsupported fields (e.g. `structured_rules`)
        give 400. Needs the `EDIT` level: manager and admin, so reviewers cannot edit
        rules. Others get 403; campaigns of clients you are not a member of give 404.'
      summary: Replace a campaign's name and rules
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this campaign.
        required: true
      tags:
      - campaigns
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignWriteRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          headers:
            X-Profile-Version-Created:
              schema:
                type: boolean
              description: '`true` when this request made a new profile version, `false`
                when the submitted rules equal the current version (nothing was created,
                status is still 200).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Validation or parse error (`validation_error`, `parse_error`).
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Missing, invalid or expired credentials (`not_authenticated`,
            `authentication_failed`).
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Not allowed (`permission_denied`).
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Not found (`not_found`).
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Throttled (`throttled`, with `details.retry_after`).
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unexpected server error (`internal_error`).
    patch:
      operationId: campaigns_partial_update
      description: 'Same as PUT, but every field is optional. Only the rule fields
        sent are changed; a new profile version is made only if the result differs
        from the current one. Needs the `EDIT` level: manager and admin, so reviewers
        cannot edit rules. Others get 403; campaigns of clients you are not a member
        of give 404.'
      summary: Edit a campaign's name and/or rules
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this campaign.
        required: true
      tags:
      - campaigns
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCampaignWriteRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          headers:
            X-Profile-Version-Created:
              schema:
                type: boolean
              description: '`true` when this request made a new profile version, `false`
                when the submitted rules equal the current version (nothing was created,
                status is still 200).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Validation or parse error (`validation_error`, `parse_error`).
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Missing, invalid or expired credentials (`not_authenticated`,
            `authentication_failed`).
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Not allowed (`permission_denied`).
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Not found (`not_found`).
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Throttled (`throttled`, with `details.retry_after`).
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unexpected server error (`internal_error`).
  /api/v1/campaigns/{id}/activate/:
    post:
      operationId: campaigns_activate
      description: 'draft -> active. 400 for an archived campaign or a campaign under
        an archived client. Needs the `EDIT` level: manager and admin. Others get
        403; campaigns of clients you are not a member of give 404.'
      summary: Activate a draft campaign
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this campaign.
        required: true
      tags:
      - campaigns
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Validation or parse error (`validation_error`, `parse_error`).
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Missing, invalid or expired credentials (`not_authenticated`,
            `authentication_failed`).
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Not allowed (`permission_denied`).
        '404':
          content:
            application/json:
              schema:
