  /api/v1/campaigns/{id}/provider-search/:
    post:
      operationId: campaigns_provider_search
      description: 'Searches the provider with the campaign''s rules as default filters
        (`filters` override them, `query` adds free text) and returns one page of
        companies annotated with what an import would do: `dedupe.status` is `new`,
        `duplicate` (strong match with a company already in the campaign), `possible_duplicate`
        (weak match), `already_imported` (this provider id was imported into the campaign
        before) or `invalid`. **Nothing is written.** Page with `cursor` = the previous
        `next_cursor`. Provider failures: 429 `provider_rate_limited` (`details.retry_after`),
        503 `provider_unavailable`, 502 `provider_auth` / `provider_quota_exceeded`,
        400 `provider_bad_request`; the messages are fixed and never contain upstream
        text. Throttled per user (scope `provider_search`). Needs the `EDIT` level:
        manager and admin. Others get 403; campaigns of clients you are not a member
        of give 404.'
