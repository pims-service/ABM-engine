    Connection:
      type: object
      description: A connection as returned by the API. Never contains a secret.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        client:
          type: string
          format: uuid
          readOnly: true
        category:
          allOf:
          - $ref: '#/components/schemas/CategoryEnum'
          readOnly: true
        provider:
          type: string
          readOnly: true
          description: Provider key, e.g. 'openai' or 'fake'.
        name:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ConnectionStatusEnum'
