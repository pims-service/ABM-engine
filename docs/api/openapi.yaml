      properties:
        name:
          type: string
        version:
          type: string
        links:
          $ref: '#/components/schemas/ApiLinks'
      required:
      - links
      - name
      - version
    BusinessModelEnum:
      enum:
      - b2b
      - b2c
      - both
      type: string
      description: |-
        * `b2b` - B2B
        * `b2c` - B2C
        * `both` - B2B and B2C
    Campaign:
      type: object
      description: A campaign with its current profile. ``status`` changes only through
        the actions.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        client:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/CampaignStatusEnum'
          readOnly: true
        archived_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        profile_version:
          type: integer
          readOnly: true
        profile:
          allOf:
          - $ref: '#/components/schemas/CampaignProfile'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - archived_at
      - client
      - created_at
      - id
      - name
      - profile
      - profile_version
      - status
      - updated_at
    CampaignCloneRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          description: 'Name of the copy. Default: "<name> (copy)", numbered if that
            is taken.'
          maxLength: 200
    CampaignProfile:
      type: object
      description: One immutable profile version (the rules of Brief section 3).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        campaign:
          type: string
          format: uuid
          readOnly: true
        version:
          type: integer
          readOnly: true
        offer:
          type: string
          readOnly: true
        countries:
          type: array
          items:
            type: string
          readOnly: true
        industries:
          type: array
          items:
            type: string
          readOnly: true
        company_size_min:
          type: integer
          readOnly: true
          nullable: true
        company_size_max:
          type: integer
          readOnly: true
          nullable: true
        business_model:
          allOf:
          - $ref: '#/components/schemas/BusinessModelEnum'
          readOnly: true
        excluded_industries:
          type: array
          items:
            type: string
          readOnly: true
        excluded_company_types:
          type: array
          items:
            type: string
          readOnly: true
        target_departments:
          type: array
          items:
            type: string
          readOnly: true
        preferred_buyer_titles:
          type: array
          items:
            type: string
          readOnly: true
          description: Ordered, most preferred first.
        outreach_languages:
          type: array
          items:
            type: string
          readOnly: true
        custom_rules:
          type: string
          readOnly: true
          description: Free-form qualification notes.
        change_note:
          type: string
          readOnly: true
          description: Why this version was made.
        created_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - business_model
      - campaign
      - change_note
      - company_size_max
      - company_size_min
      - countries
      - created_at
      - created_by
      - custom_rules
      - excluded_company_types
      - excluded_industries
      - id
      - industries
      - offer
      - outreach_languages
      - preferred_buyer_titles
      - target_departments
      - version
    CampaignProfileInputRequest:
      type: object
      description: |-
        The rule fields of a campaign. Anything not listed is rejected, nothing is dropped.

        On create ``offer`` is required and the rest defaults to empty. On PUT/PATCH a field left out
        keeps its value from the current version; send ``[]`` / ``null`` / ``""`` to clear it.
      properties:
        offer:
          type: string
          minLength: 1
          description: What the client sells, in plain words.
          maxLength: 5000
        countries:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 200
          description: ISO 3166-1 alpha-2 codes (case-insensitive input, stored upper
            case).
          maxItems: 100
        industries:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 200
          maxItems: 100
        company_size_min:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        company_size_max:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
          description: Must be at least `company_size_min` when both are set.
        business_model:
          $ref: '#/components/schemas/BusinessModelEnum'
        excluded_industries:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 200
          maxItems: 100
        excluded_company_types:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 200
          maxItems: 100
        target_departments:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 200
          maxItems: 100
        preferred_buyer_titles:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 200
          description: Ordered, most preferred first. Duplicates are removed keeping
            the first.
          maxItems: 100
        outreach_languages:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 200
          description: Supported language codes (`settings.OUTREACH_LANGUAGES`, `en`
            and `ar`).
          maxItems: 100
        custom_rules:
          type: string
          description: Free-form notes.
          maxLength: 10000
        change_note:
          type: string
          description: Why this version is made.
          maxLength: 1000
      required:
      - offer
    CampaignStatusEnum:
      enum:
      - draft
      - active
      - archived
      type: string
      description: |-
        * `draft` - Draft
        * `active` - Active
        * `archived` - Archived
    CampaignWriteRequest:
      type: object
      description: |-
        Body of create (POST) and edit (PUT/PATCH).

        ``name`` goes through ``update_campaign``; ``profile`` (the rules) through
        ``create_profile_version``, which makes a new version only when something changed.
      properties:
        client:
          type: string
          format: uuid
          description: Required on `POST /campaigns/`; taken from the URL on the nested
            route; cannot be changed on edit.
        name:
          type: string
          minLength: 1
          maxLength: 200
        profile:
          $ref: '#/components/schemas/CampaignProfileInputRequest'
      required:
      - name
    Check:
      type: object
      description: One readiness check; the extra fields depend on the check (documentation
        only).
      properties:
        status:
          $ref: '#/components/schemas/CheckStatusEnum'
        detail:
          type: string
          description: Fixed explanation of a failure.
        pending:
          type: array
          items:
            type: string
          description: 'migrations: up to 10 unapplied migrations.'
        pending_count:
          type: integer
          description: 'migrations: total pending.'
        clusters:
          type: integer
          description: 'worker: live clusters.'
        heartbeat_age_seconds:
          type: number
          format: double
          description: 'worker: age of the newest heartbeat.'
      required:
      - status
    CheckStatusEnum:
      enum:
      - ok
      - fail
      - skipped
      type: string
      description: |-
        * `ok` - ok
        * `fail` - fail
        * `skipped` - skipped
    Client:
      type: object
      description: |-
        A client. ``status`` and the timestamps are read-only: use ``archive/`` and ``restore/``.

        Name uniqueness (case-insensitive, among non-archived clients) is enforced by the service
        layer and reported as a ``name`` field error in the standard error envelope.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 200
        notes:
          type: string
        status:
          allOf:
          - $ref: '#/components/schemas/ClientStatusEnum'
          readOnly: true
        archived_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - archived_at
      - created_at
      - id
      - name
      - status
      - updated_at
    ClientRequest:
      type: object
      description: |-
        A client. ``status`` and the timestamps are read-only: use ``archive/`` and ``restore/``.

        Name uniqueness (case-insensitive, among non-archived clients) is enforced by the service
        layer and reported as a ``name`` field error in the standard error envelope.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        notes:
          type: string
      required:
      - name
    ClientStatusEnum:
      enum:
      - active
      - archived
      type: string
      description: |-
        * `active` - Active
        * `archived` - Archived
    ErrorBody:
      type: object
      description: The `error` object of the standard envelope (apps/core/exceptions.py).
      properties:
        code:
          type: string
          description: Stable machine-readable code, e.g. `validation_error`.
        message:
          type: string
          description: Human-readable summary; may change, do not parse.
        details:
          nullable: true
          description: Field errors for `validation_error`, `{retry_after}` for `throttled`,
            else null.
        request_id:
          type: string
          nullable: true
          description: Value of the `X-Request-ID` response header.
      required:
      - code
      - details
      - message
      - request_id
    ErrorEnvelope:
      type: object
      description: Every error response of the API has this body.
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
      required:
      - error
    Health:
      type: object
      description: Body of `/healthz` (documentation only).
      properties:
        status:
          $ref: '#/components/schemas/HealthStatusEnum'
      required:
      - status
    HealthStatusEnum:
      enum:
      - ok
      type: string
      description: '* `ok` - ok'
    PaginatedCampaignList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Campaign'
    PaginatedCampaignProfileList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/CampaignProfile'
    PaginatedClientList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Client'
    PatchedCampaignWriteRequest:
      type: object
      description: |-
        Body of create (POST) and edit (PUT/PATCH).

        ``name`` goes through ``update_campaign``; ``profile`` (the rules) through
        ``create_profile_version``, which makes a new version only when something changed.
      properties:
        client:
          type: string
          format: uuid
          description: Required on `POST /campaigns/`; taken from the URL on the nested
            route; cannot be changed on edit.
        name:
          type: string
          minLength: 1
          maxLength: 200
        profile:
          $ref: '#/components/schemas/CampaignProfileInputRequest'
    PatchedClientRequest:
      type: object
      description: |-
        A client. ``status`` and the timestamps are read-only: use ``archive/`` and ``restore/``.

        Name uniqueness (case-insensitive, among non-archived clients) is enforced by the service
        layer and reported as a ``name`` field error in the standard error envelope.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        notes:
          type: string
    Readiness:
      type: object
      description: 'Body of `/readyz`: 200 when `status` is `ok`, 503 when `unavailable`.'
      properties:
        status:
          $ref: '#/components/schemas/ReadinessStatusEnum'
        checks:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Check'
          description: 'Keyed by check: database, migrations, worker.'
      required:
      - checks
      - status
    ReadinessStatusEnum:
      enum:
      - ok
      - unavailable
      type: string
      description: |-
        * `ok` - ok
        * `unavailable` - unavailable
    RefreshTokenRequest:
      type: object
      description: Body of `refresh/` and `logout/` (documentation only; the views
        read the raw body).
      properties:
        refresh:
          type: string
          minLength: 1
          description: Refresh token. May be omitted when the refresh cookie is enabled.
    RulesSummary:
      type: object
      description: |-
        The profile in the structure the AI prompts consume. Versioned by `schema_version`.

        Built by `apps.campaigns.rules_summary.build_rules_summary`; see that module for the
        contract. A change to this shape must bump `schema_version`.
      properties:
        schema_version:
          type: integer
          description: Shape of this document; currently 1.
        campaign:
          $ref: '#/components/schemas/RulesSummaryCampaign'
        profile_version:
          type: integer
          description: The CampaignProfile version used.
        offer:
          type: string
        targeting:
          $ref: '#/components/schemas/RulesSummaryTargeting'
        exclusions:
          $ref: '#/components/schemas/RulesSummaryExclusions'
        buyers:
          $ref: '#/components/schemas/RulesSummaryBuyers'
        outreach:
          $ref: '#/components/schemas/RulesSummaryOutreach'
        custom_rules:
          type: string
        structured_rules:
          type: array
          items:
            type: object
            additionalProperties: {}
          description: Reserved for a future machine-readable rule list; always empty
            in schema_version 1.
      required:
      - buyers
      - campaign
      - custom_rules
      - exclusions
      - offer
      - outreach
      - profile_version
      - schema_version
      - structured_rules
      - targeting
    RulesSummaryBuyers:
      type: object
      properties:
        target_departments:
          type: array
          items:
            type: string
        preferred_buyer_titles:
          type: array
          items:
            type: string
          description: Most preferred first.
      required:
      - preferred_buyer_titles
      - target_departments
    RulesSummaryCampaign:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
      required:
      - id
      - name
    RulesSummaryCompanySize:
      type: object
      properties:
        min:
          type: integer
          nullable: true
        max:
          type: integer
          nullable: true
      required:
      - max
      - min
    RulesSummaryExclusions:
      type: object
      properties:
        industries:
          type: array
          items:
            type: string
        company_types:
          type: array
          items:
            type: string
      required:
      - company_types
      - industries
    RulesSummaryOutreach:
      type: object
      properties:
        languages:
          type: array
          items:
            type: string
      required:
      - languages
    RulesSummaryTargeting:
      type: object
      properties:
        countries:
          type: array
          items:
            type: string
        industries:
          type: array
          items:
            type: string
        company_size:
          $ref: '#/components/schemas/RulesSummaryCompanySize'
        business_model:
          $ref: '#/components/schemas/BusinessModelEnum'
      required:
      - business_model
      - company_size
      - countries
      - industries
    TokenObtainPairRequest:
      type: object
      properties:
        email:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
    TokenResponse:
      type: object
      description: Tokens returned by `login/` and `refresh/` (documentation only).
      properties:
        access:
          type: string
          description: Short-lived JWT access token (Bearer).
        refresh:
          type: string
          description: Refresh token. Omitted when the refresh cookie is enabled (it
            is then delivered as an httpOnly cookie).
      required:
      - access
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
        name:
          type: string
          readOnly: true
        is_staff:
          type: boolean
          readOnly: true
          description: Can sign in to the Django admin.
        last_login:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - email
      - id
      - is_staff
      - last_login
      - name
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
- name: auth
  description: JWT login, refresh, logout and the current user.
- name: campaigns
  description: Campaigns, versioned profiles, rules summary.
- name: clients
  description: 'Clients (tenants): list, create, edit, archive.'
- name: health
  description: Liveness and readiness probes (no auth).
- name: meta
  description: API metadata.
