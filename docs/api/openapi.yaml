          description: Not found (`not_found`).
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Throttled (`throttled`, with `details.retry_after`).
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unexpected server error (`internal_error`).
  /api/v1/campaigns/{id}/archive/:
    post:
      operationId: campaigns_archive
      description: 'Soft delete: the campaign leaves default lists, all its data and
        profile versions are kept. Idempotent. 409 `campaign_has_active_jobs` while
        it has queued or running jobs. Needs the `MANAGE` level: admin. Others get
        403; campaigns of clients you are not a member of give 404.'
      summary: Archive a campaign
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this campaign.
        required: true
      tags:
      - campaigns
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Missing, invalid or expired credentials (`not_authenticated`,
            `authentication_failed`).
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Not allowed (`permission_denied`).
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Not found (`not_found`).
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Conflict with the current state (e.g. `client_has_active_jobs`).
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Throttled (`throttled`, with `details.retry_after`).
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unexpected server error (`internal_error`).
  /api/v1/campaigns/{id}/clone/:
    post:
      operationId: campaigns_clone
      description: 'Creates an independent draft campaign in the same client whose
        version 1 profile is a copy of the source''s CURRENT rules. Nothing else is
        copied (no history, companies or jobs) and the two campaigns never share rows.
        The source may be archived. Audited with the source id. The name defaults
        to `<name> (copy)`; 400 if a given name is taken or the client is archived.
        Needs the `EDIT` level: manager and admin. Others get 403; campaigns of clients
        you are not a member of give 404.'
      summary: Clone a campaign
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this campaign.
        required: true
      tags:
      - campaigns
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignCloneRequest'
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Validation or parse error (`validation_error`, `parse_error`).
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Missing, invalid or expired credentials (`not_authenticated`,
            `authentication_failed`).
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Not allowed (`permission_denied`).
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Not found (`not_found`).
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Throttled (`throttled`, with `details.retry_after`).
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unexpected server error (`internal_error`).
  /api/v1/campaigns/{id}/profile-versions/:
    get:
      operationId: campaigns_profile_versions_list
      description: 'Every version of the campaign''s rules, newest first, paginated.
        Old versions are immutable and stay retrievable. Needs the `READ` level: any
        member. Others get 403; campaigns of clients you are not a member of give
        404.'
      summary: Profile version history
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this campaign.
        required: true
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - campaigns
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCampaignProfileList'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Missing, invalid or expired credentials (`not_authenticated`,
            `authentication_failed`).
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Not allowed (`permission_denied`).
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Not found (`not_found`).
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Throttled (`throttled`, with `details.retry_after`).
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unexpected server error (`internal_error`).
  /api/v1/campaigns/{id}/profile-versions/{version}/:
    get:
      operationId: campaigns_profile_versions_retrieve
      description: 'The rules exactly as they were in version `version`. 404 if the
        campaign has no such version. Needs the `READ` level: any member. Others get
