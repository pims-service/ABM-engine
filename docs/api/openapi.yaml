  /api/v1/campaigns/{id}/provider-import/:
    post:
      operationId: campaigns_provider_import
      description: 'Imports the selection into the campaign as one `provider` import
        batch. Give `companies` (the `items[].company` objects of a preview) or `provider_ids`
        (found again with `search`, default the campaign''s rules). At most `max_import_selection`
        (see `/providers/`, default 100) per request, else 400. Every company goes
        through the same validation and duplicate handling as manual and CSV rows:
        strong duplicates link to the existing company (never edited), weak ones are
        created and flagged, and a provider id already imported into the campaign
        is always a `duplicate` row, never a second company. Each created company
        records the provider, provider id and `retrieved_at` as a data source. Up
        to `inline_import_max` (25) companies are processed in the request (**201**,
        batch finished); larger selections run in a background job (**202**, poll
        `GET /provider-imports/{id}/`). A provider failure while finding ids leaves
        the batch `partial` or `failed` with the safe provider error code on the affected
        rows. Throttled per user (scope `provider_import`). Needs the `EDIT` level:
        manager and admin. Others get 403; campaigns of clients you are not a member
        of give 404.'
      summary: Import selected provider companies
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
