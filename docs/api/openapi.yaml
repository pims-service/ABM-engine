openapi: 3.0.3
info:
  title: ABM Engine API
  version: 0.1.0
  description: 'Backend API of the ABM Engine. Authenticate with `POST /api/v1/auth/login/`
    and send `Authorization: Bearer <access>`. Every error uses the `ErrorEnvelope`
    body.'
paths:
  /api/v1/:
    get:
      operationId: api_root
      description: Public entry point of the v1 API.
      summary: API name, version and self link
      tags:
      - meta
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiRoot'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Throttled (`throttled`, with `details.retry_after`).
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unexpected server error (`internal_error`).
  /api/v1/auth/login/:
    post:
      operationId: auth_login
      description: |-
        Exchange email and password for an access and refresh token.

        Every failure (unknown email, wrong password, inactive user) returns the same generic 401.
      summary: Log in
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Validation or parse error (`validation_error`, `parse_error`).
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Missing, invalid or expired credentials (`not_authenticated`,
            `authentication_failed`).
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Throttled (`throttled`, with `details.retry_after`).
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unexpected server error (`internal_error`).
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout
      description: Blacklist the refresh token (and clear the cookie). Access tokens
        expire on their own.
      summary: Log out (blacklist the refresh token)
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      security:
      - {}
      responses:
        '204':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Validation or parse error (`validation_error`, `parse_error`).
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Missing, invalid or expired credentials (`not_authenticated`,
            `authentication_failed`).
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Throttled (`throttled`, with `details.retry_after`).
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unexpected server error (`internal_error`).
  /api/v1/auth/me/:
    get:
      operationId: auth_me
      description: The authenticated user.
      summary: Current user
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Missing, invalid or expired credentials (`not_authenticated`,
            `authentication_failed`).
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Throttled (`throttled`, with `details.retry_after`).
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unexpected server error (`internal_error`).
  /api/v1/auth/refresh/:
    post:
      operationId: auth_refresh
      description: 'Rotate: returns a new access token and a new refresh token, blacklisting
        the old one.'
      summary: Refresh the token pair
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Validation or parse error (`validation_error`, `parse_error`).
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Missing, invalid or expired credentials (`not_authenticated`,
            `authentication_failed`).
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Throttled (`throttled`, with `details.retry_after`).
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unexpected server error (`internal_error`).
  /api/v1/campaigns/:
    get:
      operationId: campaigns_list
      description: 'Campaigns of the clients the user is a member of (all for a global
        admin), paginated, each with its current profile. Archived campaigns are hidden
        unless `archived`/`status` ask for them. Filter by `client`, or use `/clients/{client_pk}/campaigns/`.
        Needs the `READ` level: any member. Others get 403; campaigns of clients you
        are not a member of give 404.'
      summary: List campaigns
      parameters:
      - in: query
        name: archived
        schema:
          enum:
          - 'false'
          - 'true'
          - all
          type: string
          minLength: 1
        description: |-
          `false` (default) hides archived campaigns, `true` shows only archived ones, `all` shows both.

          * `false` - false
          * `true` - true
          * `all` - all
      - in: query
        name: client
        schema:
          type: string
          format: uuid
        description: Only campaigns of this client (ignored on the nested route).
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          enum:
          - draft
          - active
          - archived
          type: string
          minLength: 1
        description: |-
          Only campaigns with this status. `archived` implies `archived=true` unless `archived` is given.

          * `draft` - Draft
          * `active` - Active
          * `archived` - Archived
      tags:
      - campaigns
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCampaignList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Validation or parse error (`validation_error`, `parse_error`).
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Missing, invalid or expired credentials (`not_authenticated`,
            `authentication_failed`).
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Not allowed (`permission_denied`).
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Throttled (`throttled`, with `details.retry_after`).
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unexpected server error (`internal_error`).
    post:
      operationId: campaigns_create
      description: 'Creates a draft campaign and its profile version 1 in one transaction.
        `client` is required. The name must be unique, ignoring case, among the client''s
        non-archived campaigns. Field errors on rules are nested under `profile`.
        Unsupported fields (e.g. `structured_rules`) give 400. Needs the `EDIT` level:
        manager and admin, in the target client. Others get 403; campaigns of clients
        you are not a member of give 404.'
      summary: Create a campaign
      tags:
      - campaigns
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignWriteRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Validation or parse error (`validation_error`, `parse_error`).
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Missing, invalid or expired credentials (`not_authenticated`,
            `authentication_failed`).
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Not allowed (`permission_denied`).
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Not found (`not_found`).
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Throttled (`throttled`, with `details.retry_after`).
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unexpected server error (`internal_error`).
  /api/v1/campaigns/{campaign_id}/csv-import/:
    post:
      operationId: campaigns_csv_import_create
      description: 'Validates the whole file (same rules and errors as the preview),
        stores it privately, creates the import batch (source `csv`) and a background
        job, and returns 202 at once; rows are processed by the worker in chunks.
        Poll `status_url` (the batch: `status`, counters, `progress_percent`) until
        `status` is `completed`, `partial` (some rows failed), `failed` or `cancelled`.
        Each row is validated and de-duplicated like a manual entry; a bad row is
        recorded as failed and never stops the batch. Re-uploading the same file (SHA-256)
        into the same campaign while an earlier batch of it is pending or processing
        is 409 `import_in_progress` with the existing batch in `details.batch`; once
        it ended the same file may be imported again (rows then come back as duplicates).
        The optional `mapping` field is `{file column: field}` JSON; left out, the
        suggestion is used. 400 for an archived campaign or client. Needs the `EDIT`
        level: manager and admin. Others get 403; campaigns of clients you are not
        a member of give 404.'
      summary: Start a CSV import
      parameters:
      - in: path
        name: campaign_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - imports
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CsvUploadRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsvImportAccepted'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Validation or parse error (`validation_error`, `parse_error`).
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Missing, invalid or expired credentials (`not_authenticated`,
            `authentication_failed`).
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Not allowed (`permission_denied`).
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Not found (`not_found`).
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Conflict with the current state (e.g. `client_has_active_jobs`).
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Upload larger than the allowed size (`file_too_large`).
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Throttled (`throttled`, with `details.retry_after`).
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unexpected server error (`internal_error`).
  /api/v1/campaigns/{campaign_id}/csv-import/preview/:
    post:
      operationId: campaigns_csv_import_preview
      description: 'Reads the whole file (nothing is stored or created) and returns
        what the mapping screen needs: the headers, the mapping suggested from them,
        the first rows with the problems the import would record, totals, warnings
        (e.g. a legacy encoding), the file''s SHA-256 and the limits. Whole-file problems
        are 400 with a stable `error.code` (`empty_file`, `no_header`, `no_data_rows`,
        `binary_file`, `unsupported_format`, `undecodable`, `too_many_columns`, `header_too_long`,
        `too_many_rows` (over 5000), `name_column_missing`, `unknown_column`, `unknown_field`,
        `duplicate_target`); a file over the size limit (10 MiB) is 413 `file_too_large`.
        `details.issues` lists every problem. The optional `mapping` field is applied
        to the rows shown. Needs the `EDIT` level: manager and admin. Others get 403;
        campaigns of clients you are not a member of give 404.'
      summary: Preview a CSV upload
      parameters:
      - in: path
        name: campaign_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - imports
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CsvUploadRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsvPreview'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Validation or parse error (`validation_error`, `parse_error`).
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Missing, invalid or expired credentials (`not_authenticated`,
            `authentication_failed`).
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Not allowed (`permission_denied`).
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Not found (`not_found`).
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Upload larger than the allowed size (`file_too_large`).
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Throttled (`throttled`, with `details.retry_after`).
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unexpected server error (`internal_error`).
  /api/v1/campaigns/{campaign_pk}/companies/:
    get:
      operationId: campaign_companies_list
      description: 'Companies of one campaign, paginated, each with its newest analysis
        job (`analysis`) and the possible-duplicate pointer. Archived companies are
        hidden unless `archived` asks for them. `search` matches name, domain and
        website. Needs the `READ` level: any member of the campaign''s client. Others
        get 403; companies of clients you are not a member of give 404.'
      summary: List a campaign's companies
      parameters:
      - in: query
        name: archived
        schema:
          enum:
          - 'false'
          - 'true'
          - all
          type: string
          minLength: 1
        description: |-
          `false` (default) hides archived companies, `true` shows only archived ones, `all` shows both.

          * `false` - false
          * `true` - true
          * `all` - all
      - in: path
        name: campaign_pk
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: input_source
        schema:
          enum:
          - manual
          - csv
          - provider
          type: string
          minLength: 1
        description: |-
          How the company came in.

          * `manual` - Manual
          * `csv` - CSV import
          * `provider` - Provider
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: possible_duplicate
        schema:
          enum:
          - 'true'
          - 'false'
          type: string
          minLength: 1
        description: |-
          `true`: only companies flagged as a possible duplicate; `false`: the rest.

          * `true` - true
          * `false` - false
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          enum:
          - pending
          - analyzing
          - analyzed
          - failed
          type: string
          minLength: 1
        description: |-
          Only companies with this status.

          * `pending` - Pending
          * `analyzing` - Analyzing
          * `analyzed` - Analyzed
          * `failed` - Failed
      tags:
      - companies
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCompanyList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Validation or parse error (`validation_error`, `parse_error`).
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Missing, invalid or expired credentials (`not_authenticated`,
            `authentication_failed`).
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Not allowed (`permission_denied`).
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Not found (`not_found`).
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Throttled (`throttled`, with `details.retry_after`).
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unexpected server error (`internal_error`).
    post:
      operationId: campaign_companies_create
      description: 'Manual entry (Brief section 4A). Send `name` and a `website` and/or
        `profile_url` (`country` optional), or `input` for one free-text box; `analyze:
        true` also queues an analysis. The entry runs through a one-row manual import
        batch: **201** when a company was created (a weak name-and-country match still
        creates it, flagged `possible_duplicate`); **200** when a strong match (same
        domain or profile) already exists in the campaign: that company is returned
        **unchanged** with `duplicate: true` (an archived one is restored: `restored:
        true`). Field errors use the stable codes of the import schema: `details.<field>[].code`.
        Nothing is created for invalid input. Archived campaigns and clients take
        no companies (400). Needs the `EDIT` level: manager and admin, in the campaign''s
        client. Others get 403; companies of clients you are not a member of give
        404.'
      summary: Add one company by hand
      parameters:
      - in: path
        name: campaign_pk
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - companies
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualCompanyRequest'
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManualEntryResult'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManualEntryResult'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Validation or parse error (`validation_error`, `parse_error`).
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Missing, invalid or expired credentials (`not_authenticated`,
            `authentication_failed`).
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Not allowed (`permission_denied`).
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Not found (`not_found`).
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Throttled (`throttled`, with `details.retry_after`).
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unexpected server error (`internal_error`).
  /api/v1/campaigns/{id}/:
    get:
      operationId: campaigns_retrieve
      description: 'The campaign with its current profile. Archived campaigns can
        be retrieved by id. Needs the `READ` level: any member. Others get 403; campaigns
        of clients you are not a member of give 404.'
      summary: Get a campaign
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this campaign.
        required: true
      tags:
      - campaigns
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Missing, invalid or expired credentials (`not_authenticated`,
            `authentication_failed`).
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Not allowed (`permission_denied`).
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Not found (`not_found`).
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Throttled (`throttled`, with `details.retry_after`).
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unexpected server error (`internal_error`).
    put:
      operationId: campaigns_update
      description: '`name` and `profile.offer` are required; other rule fields left
        out keep their current value (send `[]`, `null` or `""` to clear). Changing
        any rule creates a NEW immutable profile version (the response shows it in
        `profile_version`); if the rules equal the current version nothing is created
        and the response is still 200 (see the `X-Profile-Version-Created` header).
        `name` changes are audited separately. An archived campaign is read-only (400).
        Rule field errors are nested under `profile`; unsupported fields (e.g. `structured_rules`)
        give 400. Needs the `EDIT` level: manager and admin, so reviewers cannot edit
        rules. Others get 403; campaigns of clients you are not a member of give 404.'
      summary: Replace a campaign's name and rules
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this campaign.
        required: true
