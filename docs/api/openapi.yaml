          nullable: true
          description: Company name (required unless `input` is a name). At most 300
            characters.
        website:
          type: string
          nullable: true
          description: Website or domain, e.g. `acme.com` or `https://www.acme.com/about`.
        profile_url:
          type: string
          nullable: true
          description: Public company profile URL, e.g. `https://www.linkedin.com/company/acme`.
            Used as an identifier only; it is never fetched.
        country:
          type: string
          nullable: true
          description: ISO 3166-1 alpha-2 code, any case.
        input:
          type: string
          nullable: true
          description: One free-text box. A URL or domain fills `website`, a company
            profile URL fills `profile_url`, anything else fills `name`; it only fills
            a field you left empty (`input_conflicts_with_field` otherwise).
        analyze:
          type: boolean
          default: false
          description: Also queue an analysis (same as calling `analyze` next).
    ManualEntryResult:
      type: object
      description: 'Result of a manual entry: 201 when `created`, 200 for an existing
        company.'
      properties:
        outcome:
          allOf:
          - $ref: '#/components/schemas/ManualEntryResultOutcomeEnum'
          description: |-
            `created`, `duplicate` (strong match: the existing company is returned unchanged) or `restored` (a strong match that was archived is back).

            * `created` - created
            * `duplicate` - duplicate
            * `restored` - restored
        created:
          type: boolean
        duplicate:
          type: boolean
          description: True for a strong match (outcome not created).
        restored:
          type: boolean
          description: True when an archived duplicate was restored.
        possible_duplicate:
          type: boolean
          description: True when a NEW company was created next to a weak match.
        possible_duplicate_of:
          allOf:
          - $ref: '#/components/schemas/PossibleDuplicateOf'
          nullable: true
        company:
          $ref: '#/components/schemas/CompanyDetail'
        batch_id:
          type: string
          format: uuid
          description: The one-row manual ImportBatch.
        import_row:
          $ref: '#/components/schemas/ImportRowSummary'
        analysis:
          allOf:
          - $ref: '#/components/schemas/AnalysisJob'
          nullable: true
          description: The analysis job when `analyze` was true (or one was already
            queued).
      required:
      - analysis
      - batch_id
      - company
      - created
      - duplicate
      - import_row
      - outcome
      - possible_duplicate
      - possible_duplicate_of
      - restored
    ManualEntryResultOutcomeEnum:
      enum:
      - created
      - duplicate
      - restored
      type: string
      description: |-
        * `created` - created
        * `duplicate` - duplicate
        * `restored` - restored
    NullEnum:
      enum:
      - null
    PaginatedCampaignList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Campaign'
    PaginatedCampaignProfileList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/CampaignProfile'
    PaginatedClientList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Client'
    PaginatedCompanyList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Company'
    PaginatedConnectionList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Connection'
    PatchedCampaignWriteRequest:
      type: object
      description: |-
        Body of create (POST) and edit (PUT/PATCH).

        ``name`` goes through ``update_campaign``; ``profile`` (the rules) through
        ``create_profile_version``, which makes a new version only when something changed.
      properties:
        client:
          type: string
          format: uuid
          description: Required on `POST /campaigns/`; taken from the URL on the nested
            route; cannot be changed on edit.
        name:
          type: string
          minLength: 1
          maxLength: 200
        profile:
          $ref: '#/components/schemas/CampaignProfileInputRequest'
    PatchedClientRequest:
      type: object
      description: |-
        A client. ``status`` and the timestamps are read-only: use ``archive/`` and ``restore/``.

        Name uniqueness (case-insensitive, among non-archived clients) is enforced by the service
        layer and reported as a ``name`` field error in the standard error envelope.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        notes:
          type: string
    PatchedConnectionUpdateRequest:
      type: object
      description: 'Category and provider are fixed: create a new connection to switch
        provider.'
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        config:
          type: object
          additionalProperties: {}
          description: Replaces the whole config. Secrets are rejected here.
        credentials:
          type: object
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 4096
          writeOnly: true
          nullable: true
          description: 'Write-only secrets by name, e.g. `{"api_key": "..."}`. On
            update they replace all stored credentials. Never returned.'
    PossibleDuplicateOf:
      type: object
      description: A short pointer to another company of the same campaign.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        website:
          type: string
          readOnly: true
          description: As entered.
        domain:
          type: string
          readOnly: true
          nullable: true
          description: Normalized, or null.
        archived_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - archived_at
      - domain
      - id
      - name
      - website
    Readiness:
      type: object
      description: 'Body of `/readyz`: 200 when `status` is `ok`, 503 when `unavailable`.'
      properties:
        status:
          $ref: '#/components/schemas/ReadinessStatusEnum'
        checks:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Check'
          description: 'Keyed by check: database, migrations, worker.'
      required:
      - checks
      - status
    ReadinessStatusEnum:
      enum:
      - ok
      - unavailable
      type: string
      description: |-
        * `ok` - ok
        * `unavailable` - unavailable
    RefreshTokenRequest:
      type: object
      description: Body of `refresh/` and `logout/` (documentation only; the views
        read the raw body).
      properties:
        refresh:
          type: string
          minLength: 1
          description: Refresh token. May be omitted when the refresh cookie is enabled.
    ResearchSummary:
      type: object
      description: The current (latest) research snapshot of a company. Null facts
        mean "not found".
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        researched_at:
          type: string
          format: date-time
          readOnly: true
        industry:
          type: string
          readOnly: true
          nullable: true
        description:
          type: string
          readOnly: true
          nullable: true
        headquarters:
          type: string
          readOnly: true
          nullable: true
        employee_count:
          type: integer
          readOnly: true
          nullable: true
        business_model:
          type: string
          readOnly: true
          nullable: true
          description: Free text, as found.
        classification:
          readOnly: true
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/ClassificationEnum'
          - $ref: '#/components/schemas/NullEnum'
        data_source:
          type: string
          format: uuid
          readOnly: true
      required:
      - business_model
      - classification
      - data_source
      - description
      - employee_count
      - headquarters
      - id
      - industry
      - researched_at
    ResultEnum:
      enum:
      - ok
      - failed
      - unconfigured
      type: string
      description: |-
        * `ok` - ok
        * `failed` - failed
        * `unconfigured` - unconfigured
    RulesSummary:
      type: object
      description: |-
        The profile in the structure the AI prompts consume. Versioned by `schema_version`.

        Built by `apps.campaigns.rules_summary.build_rules_summary`; see that module for the
        contract. A change to this shape must bump `schema_version`.
      properties:
        schema_version:
          type: integer
          description: Shape of this document; currently 1.
        campaign:
          $ref: '#/components/schemas/RulesSummaryCampaign'
        profile_version:
          type: integer
          description: The CampaignProfile version used.
        offer:
          type: string
        targeting:
          $ref: '#/components/schemas/RulesSummaryTargeting'
        exclusions:
          $ref: '#/components/schemas/RulesSummaryExclusions'
        buyers:
          $ref: '#/components/schemas/RulesSummaryBuyers'
        outreach:
          $ref: '#/components/schemas/RulesSummaryOutreach'
        custom_rules:
          type: string
        structured_rules:
          type: array
          items:
            type: object
            additionalProperties: {}
          description: Reserved for a future machine-readable rule list; always empty
            in schema_version 1.
      required:
      - buyers
      - campaign
      - custom_rules
      - exclusions
      - offer
      - outreach
      - profile_version
      - schema_version
      - structured_rules
      - targeting
    RulesSummaryBuyers:
      type: object
      properties:
        target_departments:
          type: array
          items:
            type: string
        preferred_buyer_titles:
          type: array
          items:
            type: string
          description: Most preferred first.
      required:
      - preferred_buyer_titles
      - target_departments
    RulesSummaryCampaign:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
      required:
      - id
      - name
    RulesSummaryCompanySize:
      type: object
      properties:
        min:
          type: integer
          nullable: true
        max:
          type: integer
          nullable: true
      required:
      - max
      - min
    RulesSummaryExclusions:
      type: object
      properties:
        industries:
          type: array
          items:
            type: string
        company_types:
          type: array
          items:
            type: string
      required:
      - company_types
      - industries
    RulesSummaryOutreach:
      type: object
      properties:
        languages:
          type: array
          items:
            type: string
      required:
      - languages
    RulesSummaryTargeting:
      type: object
      properties:
        countries:
          type: array
          items:
            type: string
        industries:
          type: array
          items:
            type: string
        company_size:
          $ref: '#/components/schemas/RulesSummaryCompanySize'
        business_model:
          $ref: '#/components/schemas/BusinessModelEnum'
      required:
      - business_model
      - company_size
      - countries
      - industries
    TokenObtainPairRequest:
      type: object
      properties:
        email:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
    TokenResponse:
      type: object
      description: Tokens returned by `login/` and `refresh/` (documentation only).
      properties:
        access:
          type: string
          description: Short-lived JWT access token (Bearer).
        refresh:
          type: string
          description: Refresh token. Omitted when the refresh cookie is enabled (it
            is then delivered as an httpOnly cookie).
      required:
      - access
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
        name:
          type: string
          readOnly: true
        is_staff:
          type: boolean
          readOnly: true
          description: Can sign in to the Django admin.
        last_login:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - email
      - id
      - is_staff
      - last_login
      - name
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
- name: auth
  description: JWT login, refresh, logout and the current user.
- name: campaigns
  description: Campaigns, versioned profiles, rules summary.
- name: clients
  description: 'Clients (tenants): list, create, edit, archive.'
- name: companies
  description: Manual company entry, list, detail, archive and Analyze Company.
- name: integrations
  description: Per-client provider connections; credentials are write-only.
- name: health
  description: Liveness and readiness probes (no auth).
- name: imports
  description: 'Company import: CSV template, upload, batches.'
- name: meta
  description: API metadata.
