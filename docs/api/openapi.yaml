  /api/v1/integrations/connections/{id}/test/:
    post:
      operationId: integration_connections_test
      description: 'Runs the provider''s lightweight check with the stored credentials
        and stores the outcome (`last_tested_at`, `last_test_status`, `last_test_message`).
        A failure moves an active connection to `error`; a success clears `error`.
        When no test exists for the provider yet the result is `unconfigured`: nothing
        is stored and nothing is claimed to work. Credentials are never returned and
        the message is scrubbed. Limited to 5 tests per minute per connection (429
        `throttled`, with `Retry-After`). Archived connections cannot be tested (400).
        Admin only: it uses credentials, so it is a `MANAGE` action. Needs the `MANAGE`
        level: admin. Others get 403; clients you are not a member of give 404.'
