components:
  schemas:
    AnalysisJob:
      type: object
      description: The background job behind an "Analyze Company" request (see `GET`
        job status in M4).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        type:
          type: string
          readOnly: true
          description: A job type registered in code (`@tracked_job`), not free input.
        status:
          allOf:
          - $ref: '#/components/schemas/JobStatusEnum'
          readOnly: true
        total_count:
          type: integer
          readOnly: true
        done_count:
          type: integer
          readOnly: true
        failed_count:
          type: integer
          readOnly: true
        error_summary:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        started_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        finished_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - created_at
      - done_count
      - error_summary
      - failed_count
      - finished_at
      - id
      - started_at
      - status
      - total_count
      - type
    AnalysisRequest:
      type: object
      description: Result of `POST /companies/{id}/analyze/` (HTTP 202).
      properties:
        company_id:
          type: string
          format: uuid
        job:
          $ref: '#/components/schemas/AnalysisJob'
        already_queued:
          type: boolean
          description: 'True when the company already had a queued or running job:
            that job is returned and nothing new is queued.'
      required:
      - already_queued
      - company_id
      - job
    ApiLinks:
      type: object
      properties:
        self:
          type: string
          format: uri
          description: Absolute URL of this endpoint.
      required:
      - self
    ApiRoot:
      type: object
      description: Body of `GET /api/v1/` (documentation only).
      properties:
        name:
          type: string
        version:
          type: string
        links:
          $ref: '#/components/schemas/ApiLinks'
      required:
      - links
      - name
      - version
    BusinessModelEnum:
      enum:
      - b2b
      - b2c
      - both
      type: string
      description: |-
        * `b2b` - B2B
        * `b2c` - B2C
        * `both` - B2B and B2C
    Campaign:
      type: object
      description: A campaign with its current profile. ``status`` changes only through
        the actions.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        client:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/CampaignStatusEnum'
          readOnly: true
        archived_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        profile_version:
          type: integer
          readOnly: true
        profile:
          allOf:
          - $ref: '#/components/schemas/CampaignProfile'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - archived_at
      - client
      - created_at
      - id
      - name
      - profile
      - profile_version
      - status
      - updated_at
    CampaignCloneRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          description: 'Name of the copy. Default: "<name> (copy)", numbered if that
            is taken.'
          maxLength: 200
    CampaignProfile:
      type: object
      description: One immutable profile version (the rules of Brief section 3).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        campaign:
          type: string
          format: uuid
          readOnly: true
        version:
          type: integer
          readOnly: true
        offer:
          type: string
          readOnly: true
        countries:
          type: array
          items:
            type: string
          readOnly: true
        industries:
          type: array
          items:
            type: string
          readOnly: true
        company_size_min:
          type: integer
          readOnly: true
          nullable: true
        company_size_max:
          type: integer
          readOnly: true
          nullable: true
        business_model:
          allOf:
          - $ref: '#/components/schemas/BusinessModelEnum'
          readOnly: true
        excluded_industries:
          type: array
          items:
            type: string
          readOnly: true
        excluded_company_types:
          type: array
          items:
            type: string
          readOnly: true
        target_departments:
          type: array
          items:
            type: string
          readOnly: true
        preferred_buyer_titles:
          type: array
          items:
            type: string
          readOnly: true
          description: Ordered, most preferred first.
        outreach_languages:
          type: array
          items:
            type: string
          readOnly: true
        custom_rules:
          type: string
          readOnly: true
          description: Free-form qualification notes.
        change_note:
          type: string
          readOnly: true
          description: Why this version was made.
        created_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - business_model
      - campaign
      - change_note
      - company_size_max
      - company_size_min
      - countries
      - created_at
      - created_by
      - custom_rules
      - excluded_company_types
      - excluded_industries
      - id
      - industries
      - offer
      - outreach_languages
      - preferred_buyer_titles
      - target_departments
      - version
    CampaignProfileInputRequest:
      type: object
      description: |-
        The rule fields of a campaign. Anything not listed is rejected, nothing is dropped.

        On create ``offer`` is required and the rest defaults to empty. On PUT/PATCH a field left out
        keeps its value from the current version; send ``[]`` / ``null`` / ``""`` to clear it.
      properties:
        offer:
          type: string
          minLength: 1
          description: What the client sells, in plain words.
          maxLength: 5000
        countries:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 200
          description: ISO 3166-1 alpha-2 codes (case-insensitive input, stored upper
            case).
          maxItems: 100
        industries:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 200
          maxItems: 100
        company_size_min:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        company_size_max:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
          description: Must be at least `company_size_min` when both are set.
        business_model:
          $ref: '#/components/schemas/BusinessModelEnum'
        excluded_industries:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 200
          maxItems: 100
        excluded_company_types:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 200
          maxItems: 100
        target_departments:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 200
          maxItems: 100
        preferred_buyer_titles:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 200
