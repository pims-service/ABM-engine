        config:
          readOnly: true
          description: Non-secret settings. Never put a secret here.
        has_credentials:
          type: boolean
          readOnly: true
          description: True when credentials are stored. Their values are never shown.
        credentials_hint:
          type: object
          additionalProperties:
            type: string
          readOnly: true
          description: 'Masked hint per credential name: `****abcd` (last 4 characters)
            for long secrets, `****` for short ones.'
        credentials_updated_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        last_tested_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        last_test_status:
          allOf:
          - $ref: '#/components/schemas/LastTestStatusEnum'
          readOnly: true
        last_test_message:
          type: string
          readOnly: true
