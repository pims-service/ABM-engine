# Extends gitleaks' default rules. The allowlist is deliberately narrow: it only
# covers the obvious YOUR_* placeholders the docs use (org rule: placeholders only)
# and one throwaway value used by a test that checks passwords never reach logs.
title = "ABM Engine gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Documented placeholders, one throwaway test value, and the detect-secrets baseline (hashes only)"
paths = [
  '''^.secrets.baseline$''',
]
regexes = [
  '''^YOUR_[A-Z0-9_]+$''',
  '''^Wr0ng-Passw0rd-Marker-9917$''',
  # Deliberately fake value used by the admin audit-log redaction test
  # (backend/tests/test_admin.py): the test proves this string is masked on display.
  '''^sk-live-abc123$''',
  # Earlier fake values of the provider import leak tests (still in the branch history).
  '''^sk-live-(0123456789abcdef|abcdef0123456789)$''',
  # Fake credentials of the integration tests (tests/factories_integrations.py and the
  # tenant-isolation probe): the tests prove these never reach a response, log or audit entry.
  '''^(UNITTESTONLY|SECONDTESTONLY|ISOLATIONPROBE)SECRET[A-Za-z0-9]+$''',
]
