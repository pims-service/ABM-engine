[project]
name = "abm-engine-backend"
version = "0.1.0"
description = "ABM Engine backend (Django + DRF)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.15,<4",
    "django-environ>=0.12",
    "psycopg[binary]>=3.2",
    "gunicorn>=23",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]
